# Cloudflare Pages — mcflyads.com (site/ output + functions/)
# GitHub Pages is NOT configured. Do not use Actions deploy-pages.
#
# Production ship (repo root, after merge):
#   npx wrangler pages deploy site --project-name=mcflyads --branch=main --commit-dirty=true
# Preview (optional):
#   npx wrangler pages deploy site --project-name=mcflyads --branch=preview --commit-dirty=true
name = "mcflyads"
compatibility_date = "2025-07-28"
pages_build_output_dir = "site"

# Durable waitlist backlog when Resend/FormSubmit email is unavailable.
[[kv_namespaces]]
binding = "WAITLIST"
id = "5d9e56c8e9644e58afff2395291589d5"
