services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mcfly
      POSTGRES_PASSWORD: mcfly
      POSTGRES_DB: mcfly
    ports:
      - "5432:5432"
    volumes:
      - mcfly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcfly -d mcfly"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the app in Docker after Partner link fills secrets
  # app:
  #   build:
  #     context: .
  #     dockerfile: app/Dockerfile
  #   ports:
  #     - "3000:3000"
