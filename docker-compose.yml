  #     DATABASE_URL: postgresql://mcfly:mcfly@db:5432/mcfly
  #     SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
  #     SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
  #     SCOPES: read_orders
  #     SHOPIFY_APP_URL: ${SHOPIFY_APP_URL}
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  mcfly_pg:
