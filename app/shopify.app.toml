# Mcfly Analytics — Shopify app configuration
# After Partner login: `cd app && shopify app config link` fills client_id + updates URLs on deploy.
# Do not invent a client_id. Leave blank until linked.

client_id = ""
name = "Mcfly Analytics"
application_url = "https://app.mcflyads.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# Truth MVP: order totals for cash MER. Expand only when pipes need it.
scopes = "read_orders"

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  # Mandatory App Store compliance webhooks (can share one URI; we use dedicated routes)
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

[auth]
redirect_urls = [
  "https://app.mcflyads.com/auth/callback",
  "https://app.mcflyads.com/auth/shopify/callback",
  "https://app.mcflyads.com/api/auth/callback"
]

[app_preferences]
url = "https://mcflyads.com/support.html"
