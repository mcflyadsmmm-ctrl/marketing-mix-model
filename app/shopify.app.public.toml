# Mcfly Analytics Public — App Store submission app
# Created 2026-07-28 because the original Mcfly Analytics client
# (88c56d21…) is locked to Custom distribution.
# App URL stays on Fly (never mcflyads.com).

client_id = "bbaee078a5ab871aea1cc99a9e01cabd"
name = "Mcfly Analytics Public"
application_url = "https://mcfly-analytics.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_orders,read_customers,read_all_orders"

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = ["orders/create", "orders/updated", "orders/cancelled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

[auth]
redirect_urls = [
  "https://mcfly-analytics.fly.dev/auth/callback",
  "https://mcfly-analytics.fly.dev/auth/shopify/callback",
  "https://mcfly-analytics.fly.dev/api/auth/callback"
]

[app_preferences]
url = "https://mcflyads.com/support"
