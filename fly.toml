# Mcfly Analytics on Fly.io (optional — Railway/Render also fine)
# From repo root after `fly launch`:
#   fly secrets set SHOPIFY_API_KEY=... SHOPIFY_API_SECRET=... DATABASE_URL=... SHOPIFY_APP_URL=https://....fly.dev
#   fly secrets set MCFLY_JOBS_TICK_SECRET="$(openssl rand -hex 32)"
#   fly deploy
# Queue drain: `worker` process POSTs /api/jobs/tick (no Redis). See docs/ops/JOB_QUEUE.md §6.

app = "mcfly-analytics"
primary_region = "iad"

[build]
  dockerfile = "app/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SCOPES = "read_orders,read_customers,read_all_orders"
  # Worker polls the public app URL (request-driven web dyno). Same image; no Redis.
  MCFLY_APP_URL = "https://mcfly-analytics.fly.dev"
  MCFLY_QUEUE_INTERVAL_MS = "15000"

# app = web + prisma migrate on boot. worker = HTTP tick runner only (no migrate, no ports).
[processes]
  app = "npm run docker-start"
  worker = "node scripts/queue-worker.mjs"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    # Prisma generate + migrate on boot; short grace caused false "not listening" warnings mid-deploy.
    grace_period = "90s"
    method = "GET"
    path = "/health"

# Keep headroom for 10 concurrent desks + queue drain (Prisma + GraphQL).
[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
  processes = ["app"]

# Tiny always-on poller: Bearer POST /api/jobs/tick every MCFLY_QUEUE_INTERVAL_MS.
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["worker"]
