# Mcfly Analytics on Fly.io (optional — Railway/Render also fine)
# From repo root after `fly launch`:
#   fly secrets set SHOPIFY_API_KEY=... SHOPIFY_API_SECRET=... DATABASE_URL=... SHOPIFY_APP_URL=https://....fly.dev
#   fly deploy

app = "mcfly-analytics"
primary_region = "iad"

[build]
  dockerfile = "app/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SCOPES = "read_orders"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

# Keep 1GB — Prisma migrate/generate on boot OOMs at 256MB default.
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
