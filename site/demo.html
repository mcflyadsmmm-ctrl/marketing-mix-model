  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Demo | Mcfly Analytics",
    "url": "https://mcflyads.com/demo",
    "description": "Try the Mcfly Analytics desk on Sample shop — same UI as the Shopify app.",
    "isPartOf": {
      "@type": "WebSite",
      "name": "Mcfly Analytics",
      "url": "https://mcflyads.com/"
    }
  }
  </script>
</head>
<body class="demo-page is-light">
  <a class="skip" href="#main">Skip to content</a>
  <div data-chrome></div>

  <main id="main">
    <header class="page-hero page-hero--demo-tight">
      <p class="brand-kicker">Mcfly <span class="ads">Analytics</span></p>
      <h1>Try the desk.</h1>
      <p>Same UI as the Shopify app. Click around — not a live store. 7 days, then $39.</p>
      <div class="cta-row demo-hero-actions">
        <a class="link-cta link-cta--fill" data-mcfly-cta="primary" href="https://apps.shopify.com/mcfly-analytics-public" rel="noopener noreferrer">Install</a>
        <a class="link-cta link-cta--ghost" href="/pricing">7 days, then $39.</a>
      </div>
    </header>

    <figure class="demo-desk-frame">
      <figcaption class="demo-desk-frame__label">Sample shop</figcaption>
      <iframe
        id="live-desk"
        class="demo-live-frame"
        title="Mcfly Analytics desk"
        src="https://mcfly-analytics.fly.dev/demo?hosted=1"
      ></iframe>
    </figure>
    <script>
      (function () {
        var tabs = {
          overview: "/demo",
          spend: "/demo/spend",
          roas: "/demo/roas",
          goals: "/demo/goals",
          customers: "/demo/customers",
          growth: "/demo/growth",
          orders: "/demo/orders",
          ltv: "/demo/ltv",
          cpa: "/demo/cpa",
          allocation: "/demo/allocation",
          yoy: "/demo/yoy",
          settings: "/demo/settings"
        };
        var tab = new URLSearchParams(location.search).get("tab") || "";
        var path = tabs[tab];
        if (!path) return;
        var frame = document.getElementById("live-desk");
        if (frame) {
          var join = path.indexOf("?") >= 0 ? "&" : "?";
          frame.src = "https://mcfly-analytics.fly.dev" + path + join + "hosted=1";
        }
      })();
    </script>
  </main>

  <div data-footer></div>
  <script src="/assets/cta-config.js?v=20260922v45"></script>
  <script src="/assets/mcfly/chrome.js?v=20260922v45"></script>
</body>
</html>
