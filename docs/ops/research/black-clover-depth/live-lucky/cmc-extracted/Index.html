<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root { --slate-900:#0f172a; --slate-800:#1e293b; --slate-500:#64748b; --slate-400:#94a3b8; --slate-100:#f1f5f9;
          --line:#e2e8f0; --green:#059669; --emerald-500:#10b981; --red:#dc2626; --rose:#f43f5e; --amber:#d97706;
          --violet:#7c3aed; --blue:#2563eb; --bg:#f8fafc; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--slate-900); }
  .layout { display:flex; min-height:100vh; }
  
  /* Sidebar */
  .side { width:240px; background:var(--slate-900); color:#cbd5e1; padding:24px 0 0; flex-shrink:0; display:flex; flex-direction:column; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index:10;}
  .side h1 { color:#fff; font-size:17px; letter-spacing:1px; padding:0 20px 4px; }
  .side .sub { font-size:10px; text-transform:uppercase; letter-spacing:2px; color:var(--emerald-500); padding:0 20px 20px; font-weight:700;}
  .nav { list-style:none; }
  .nav li { padding:14px 20px; font-size:14px; cursor:pointer; border-left:4px solid transparent; transition:0.2s; display:flex; align-items:center; gap:10px; font-weight:500;}
  .nav li:hover { background:var(--slate-800); color:#fff; }
  .nav li.on { background:var(--slate-800); color:#fff; border-left-color:var(--emerald-500); font-weight:700;}
  .side .foot { margin-top:auto; padding:20px; font-size:11px; color:var(--slate-500); text-align:center; border-top:1px solid rgba(255,255,255,.06); }
  
  /* Main Content */
  .main { flex:1; padding:0 32px 40px; max-width:1300px; width:100%; overflow-x:hidden; }
  
  /* Header & Admin Controls */
  .header-bar { display:flex; justify-content:space-between; align-items:center; margin: 24px 0; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .header-bar h2 { font-size: 24px; font-weight: 800; color: var(--slate-900); letter-spacing:-0.5px;}
  .admin-controls { display:flex; align-items:center; gap:10px; }
  .admin-dropdown { display:none; align-items:center; gap:10px; background: #fff; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--amber); box-shadow:0 2px 4px rgba(217, 119, 6, 0.1);}
  .admin-dropdown select { padding: 6px; border-radius: 4px; border: 1px solid var(--line); font-size: 13px; font-weight:700; color:var(--slate-900); outline:none;}
  .admin-badge { background: var(--amber); color: #fff; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }

  /* Controls */
  .slicers { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; align-items:center; }
  .slicers select, .slicers input, .searchbox { padding:10px 14px; border:1px solid var(--slate-400); border-radius:8px; background:#fff; font-size:14px; width:auto; max-width:100%; outline:none; transition:0.2s;}
  .slicers select:focus, .slicers input:focus, .searchbox:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
  .btn { padding:10px 18px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-size:14px; font-weight:700; transition:0.2s; display:inline-flex; align-items:center;}
  .btn.dark { background:var(--slate-900); color:#fff; border:none; }
  .btn:hover { background:var(--slate-100); }
  .btn.dark:hover { background:var(--slate-800); transform:translateY(-1px); box-shadow:0 4px 6px rgba(0,0,0,0.1);}
  
  /* Layout Grids */
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; margin-bottom:28px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; border-left:5px solid var(--emerald-500); box-shadow:0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); transition:0.2s;}
  .card:hover { transform:translateY(-2px); box-shadow:0 10px 15px -3px rgba(0,0,0,0.05); }
  .card.violet { border-left-color:var(--violet); } .card.blue { border-left-color:var(--blue); } .card.rose { border-left-color:var(--rose); } .card.amber { border-left-color:var(--amber); } 
  .card .t { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--slate-500); font-weight:800; }
  .card .v { font-size:32px; font-weight:800; margin:8px 0 4px; color:var(--slate-900); letter-spacing:-1px;}
  .card .d { font-size:13px; font-weight:600; }
  .up { color:var(--green); } .down { color:var(--red); } .mut { color:var(--slate-500); }
  
  .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px; margin-bottom:28px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.05); overflow:hidden;}
  .panel h3 { font-size:15px; text-transform:uppercase; letter-spacing:1px; color:var(--slate-900); margin-bottom:20px; font-weight:800;}
  
  /* Tables */
  .table-responsive { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; font-size:14px; min-width:600px; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--slate-500); padding:12px 14px; border-bottom:2px solid var(--line); white-space:nowrap; }
  td { padding:14px; border-bottom:1px solid var(--slate-100); vertical-align: middle; }
  tr:hover { background:#f8fafc; }
  th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
  
  /* Status & Tracking UI */
  .status-pill { display:inline-flex; align-items:center; padding: 4px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
  .status-pill.billed { background: #ecfdf5; color: #065f46; } 
  .status-pill.pending { background: #fffbeb; color: #92400e; } 
  .status-pill.approval { background: #fef2f2; color: #991b1b; } 
  .status-pill.shipped { background: #eff6ff; color: #1e40af; } 
  .status-pill.default { background: #f1f5f9; color: #475569; } 

  .tag { font-size:10px; font-weight:800; padding:3px 8px; border-radius:10px; white-space:nowrap; margin-left:6px;}
  .tag.HOT { background:#ecfdf5; color:#065f46; }
  .tag.COLD { background:#fef2f2; color:#991b1b; }
  .tag.NEW { background:#eff6ff; color:#1d4ed8; }

  .trk-link { display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--blue); text-decoration:none; background:#eff6ff; padding:6px 12px; border-radius:8px; transition:0.2s; }
  .trk-link:hover { background:#dbeafe; color:#1e40af; transform:scale(1.02); }
  .trk-icon { font-size:14px; }
  .email-link { color:var(--slate-500); font-size:12px; text-decoration:none; display:inline-block; margin-top:4px; font-weight:500;}
  .email-link:hover { color:var(--blue); text-decoration:underline; }

  /* Misc */
  .spin { padding:80px; text-align:center; color:var(--slate-500); font-size: 16px; font-weight: 600;}
  .empty { padding:60px; text-align:center; color:var(--slate-500); font-size:15px; font-weight:500;}
  .split { display:grid; grid-template-columns:360px 1fr; gap:28px; align-items:start; }
  .chart-grid { display:grid; grid-template-columns:1.5fr 1fr; gap:28px; }
  
  .listbox { max-height:600px; overflow-y:auto; border-radius:8px; }
  .listrow { display:flex; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--slate-100); cursor:pointer; font-size:14px; align-items:center; transition:0.1s;}
  .listrow:hover { background:#f8fafc; } .listrow.sel { background:#eff6ff; border-left: 4px solid var(--blue); }
  .pager { display:flex; gap:12px; align-items:center; margin-top:20px; font-size:14px; font-weight:700; justify-content: center; }
  .pager button { padding:10px 20px; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; font-weight:700; color:var(--slate-900); transition:0.2s;}
  .pager button:disabled { opacity: 0.4; cursor:not-allowed; }
  .pager button:hover:not(:disabled) { background:var(--slate-100); }

  svg text { font-family:inherit; }
  rect:hover { opacity: 0.85; }

  /* Mobile Styles */
  @media (max-width:1000px) {
    .layout { flex-direction:column; }
    .side { width:100%; padding:15px; align-items:center; }
    .side h1 { padding:0; margin-bottom:4px; text-align:center; }
    .side .sub { padding:0 0 15px; text-align:center; }
    .side .foot { display:none; }
    .nav { display:flex; flex-direction:row; overflow-x:auto; width:100%; padding-bottom:0; justify-content:flex-start; -webkit-overflow-scrolling:touch; border-bottom:1px solid rgba(255,255,255,0.1); }
    .nav li { border-left:none; border-bottom:4px solid transparent; padding:12px 16px; white-space:nowrap; }
    .nav li.on { border-bottom-color:var(--emerald-500); background:transparent; }
    .main { padding:16px; }
    .header-bar { flex-direction: column; gap:12px; align-items: flex-start; margin-top:16px;}
    .admin-controls { width:100%; justify-content: space-between; flex-direction:row-reverse;}
    .slicers { flex-direction:column; align-items:stretch; }
    .slicers select, .slicers input, .slicers .btn { width:100%; }
    .split, .chart-grid { grid-template-columns:1fr; }
    .cards { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
    .panel { padding:16px; margin-bottom:16px;}
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="side">
    <h1>BLACK CLOVER</h1>
    <div class="sub">Partner Portal</div>
    <ul class="nav" id="nav"></ul>
    <div class="foot">Secure Session Active<br><span id="repNameFoot" style="color:var(--emerald-500);font-weight:700;display:inline-block;margin-top:4px;"></span></div>
  </nav>
  <div class="main">
    
    <div class="header-bar">
      <h2 id="pageTitle">Book of Business</h2>
      <div class="admin-controls">
         <button class="btn" onclick="forceRefresh()" style="font-size:12px; padding:8px 12px;">⟳ Refresh Live Data</button>
         <div id="adminDropdown" class="admin-dropdown">
            <span class="admin-badge">Admin Mode</span>
            <select id="adminRepSelect" onchange="switchRep(this.value)"></select>
         </div>
      </div>
    </div>

    <div id="content"><div class="spin">Authenticating Secure Connection...</div></div>
  </div>
</div>

<script>
var P=null, TAB='perf', SEL_CUSTOMER=null;
var OP={page:1, status:'all', search:''};

var TABS=[
  ['perf','📊 My Performance'],
  ['orders','📦 Order Tracker'],
  ['crm','👥 My Customers'],
  ['ops','⚠️ Action Required']
];

document.getElementById('nav').innerHTML=TABS.map(function(t){
  return '<li id="nav_'+t[0]+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</li>';}).join('');

// Initial load
google.script.run.withSuccessHandler(onData).withFailureHandler(onError).getDashboardData('ALL', false);

function forceRefresh() {
  var rep = P ? P.activeRep : 'ALL';
  document.getElementById('content').innerHTML='<div class="spin">Force syncing live database...</div>';
  google.script.run.withSuccessHandler(onData).withFailureHandler(onError).getDashboardData(rep, true);
}

function onError(e) { document.getElementById('content').innerHTML='<div class="empty" style="color:var(--red)">Failed to load: '+esc(e.message||e)+'</div>'; }

function onData(json) {
  var p; try{ p = JSON.parse(json); }catch(e){ return onError('Bad JSON payload'); }
  if(!p.ok) return onError(p.error);
  P = p;
  
  document.getElementById('repNameFoot').textContent = p.activeRep === 'ALL' ? 'Company Wide' : p.activeRep;
  
  if(P.user.role === 'ADMIN') {
    var sel = document.getElementById('adminRepSelect');
    var opts = '<option value="ALL">All Company (Global)</option>';
    // Admin list now populates dynamically from the database
    if (P.allReps && P.allReps.length) {
       P.allReps.forEach(function(rep) { opts += '<option value="'+esc(rep)+'" '+(P.activeRep===rep?'selected':'')+'>'+esc(rep)+'</option>'; });
    }
    sel.innerHTML = opts;
    document.getElementById('adminDropdown').style.display = 'flex';
  }
  go(TAB);
}

function switchRep(repName) {
  document.getElementById('content').innerHTML='<div class="spin">Syncing territory data for '+esc(repName)+'...</div>';
  google.script.run.withSuccessHandler(onData).withFailureHandler(onError).getDashboardData(repName, false);
}

function go(tab){
  TAB=tab; SEL_CUSTOMER=null;
  TABS.forEach(function(t){document.getElementById('nav_'+t[0]).className=(t[0]===tab?'on':'');});
  var titles = {'perf': 'My Performance', 'orders': 'Order Tracker & Fulfillment', 'crm': 'My Customers', 'ops': 'Action Required'};
  document.getElementById('pageTitle').textContent = titles[tab];
  renderSafe();
}

// FORMATTING & SVG HELPERS
function isNum(n) { return typeof n === 'number' && !isNaN(n) && isFinite(n); }
function money(n){ n=Number(n)||0; return '$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0}); }
function moneyShort(n){ 
  n=Number(n)||0; var a=Math.abs(n), s=n<0?'-':'';
  if(a>=1e6) return s+'$'+(a/1e6).toFixed(1)+'M';
  if(a>=1e3) return s+'$'+(a/1e3).toFixed(0)+'K'; 
  return s+'$'+a.toFixed(0); 
}
function num(n){ return Number(n||0).toLocaleString('en-US'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function attr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function kcard(t,v,d,cls){return '<div class="card '+(cls||'')+'"><div class="t">'+t+'</div><div class="v">'+v+'</div>'+(d||'')+'</div>';}
function delta(cur,py){
  if(!isNum(py) || py === 0) return '<span class="d mut">No PY basis</span>';
  var p = (cur-py)/Math.abs(py)*100;
  if(!isNum(p)) return '<span class="d mut">No PY basis</span>';
  return '<span class="d '+(p>=0?'up':'down')+'">'+(p>=0?'▲':'▼')+' '+Math.abs(p).toFixed(1)+'% vs PY</span>';
}

function barChart(items,w,h,fmt,color){
  if(!items || !items.length) return '<div class="empty">No data available</div>';
  var max=Math.max.apply(null,items.map(function(i){return Math.abs(i.v);}))||1;
  var bw=Math.max(Math.floor(w/items.length)-8,12);
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;overflow:visible;margin-top:10px;">'+items.map(function(it,i){
    var bh=Math.max(Math.round(Math.abs(it.v)/max*(h-35)),2);
    var x=i*(bw+8)+4, y=h-20-bh;
    var c = color || '#059669'; 
    if(!color && i%3===1) c = '#2563eb'; 
    if(!color && i%3===2) c = '#7c3aed'; 
    
    var valText = '<text x="'+(x+bw/2)+'" y="'+(y-6)+'" font-size="11" fill="#1e293b" font-weight="800" text-anchor="middle">'+fmt(it.v)+'</text>';
    var lbl = esc(String(it.k)).length > 10 ? esc(String(it.k).substring(0,8))+'..' : esc(it.k);
    return '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+c+'"><title>'+esc(it.k)+': '+money(it.v)+'</title></rect>' + valText +
           '<text x="'+(x+bw/2)+'" y="'+(h-4)+'" font-size="10" fill="#64748b" font-weight="600" text-anchor="middle">'+lbl+'</text>';
  }).join('')+'</svg>';
}

function renderSafe() {
  try { render(); } catch(e) { document.getElementById('content').innerHTML = '<div class="empty" style="color:var(--red)">Render Error: ' + esc(e.message) + '</div>'; }
}

function render() {
  if(!P) return;
  var el=document.getElementById('content');
  if(TAB==='perf') return renderPerf(el);
  if(TAB==='orders') return renderOrders(el);
  if(TAB==='crm') return renderCrm(el);
  if(TAB==='ops') return renderOps(el);
}

function renderPerf(el) {
  var k = P.kpis || {ytd:0, pytd:0, gross_ytd:0, backlog:0, ytd_orders:0};
  var trend = (P.trend||[]).map(function(t){ return {k: t.m.substring(5,7)+'/'+t.m.substring(2,4), v: t.v}; }); 
  var aov = k.ytd_orders ? k.ytd / k.ytd_orders : 0;
  
  var movers = [], bleeders = [];
  (P.customers||[]).forEach(function(c) {
     var diff = (c.ytd_usd || 0) - (c.pytd_usd || 0);
     if (diff > 0) movers.push({name: c.name, diff: diff, id: c.customer_id});
     if (diff < 0) bleeders.push({name: c.name, diff: diff, id: c.customer_id});
  });
  movers.sort(function(a,b){return b.diff - a.diff;});
  bleeders.sort(function(a,b){return a.diff - b.diff;});
  
  var hitListHtml = function(title, arr, isUp) {
    if(!arr.length) return '<div class="empty" style="padding:20px;">No data</div>';
    return '<table style="min-width:auto;"><tr><th>Customer</th><th class="num">YoY Delta</th></tr>' + 
      arr.slice(0,5).map(function(r){
        return '<tr style="cursor:pointer;" onclick="SEL_CUSTOMER=\''+attr(r.id)+'\';go(\'crm\')"><td><div style="font-weight:700; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(r.name)+'</div></td>' +
               '<td class="num '+(isUp?'up':'down')+'" style="font-weight:800;">'+(isUp?'+':'')+money(r.diff)+'</td></tr>';
      }).join('') + '</table>';
  };

  el.innerHTML = 
    '<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">' +
      kcard('YTD Net Sales', money(k.ytd), delta(k.ytd, k.pytd)) +
      kcard('Gross Bookings', money(k.gross_ytd), '<span class="d mut">Total before returns</span>', 'blue') +
      kcard('Avg Order Value', money(aov), '<span class="d mut">'+num(k.ytd_orders)+' total orders</span>', 'violet') +
      kcard('Open Backlog', money(k.backlog), '<span class="d mut">Pending shipment</span>', 'amber') +
    '</div>' +
    '<div class="chart-grid" style="margin-bottom:28px;">' +
       '<div class="panel" style="margin-bottom:0;"><h3>Biggest Growth Drivers (YoY Delta)</h3><div class="table-responsive">' + hitListHtml('Growth', movers, true) + '</div></div>' +
       '<div class="panel" style="margin-bottom:0; border-top:4px solid var(--red);"><h3>At Risk / Bleeding (YoY Delta)</h3><div class="table-responsive">' + hitListHtml('Loss', bleeders, false) + '</div></div>' +
    '</div>' +
    '<div class="chart-grid">' +
       '<div class="panel"><h3>Monthly Sales Trend (Trailing 12M)</h3>' + barChart(trend, 600, 220, moneyShort, '#0f172a') + '</div>' +
       '<div class="panel"><h3>YTD Category Mix</h3>' + barChart(P.categories||[], 400, 220, moneyShort) + '</div>' +
    '</div>';
}

function renderCrm(el) {
  var clist = P.customers || [];
  
  var listHtml = '<div class="panel" style="padding:0; border:none; box-shadow:none;">' +
    '<div class="listbox" style="border:1px solid var(--line);">' + clist.map(function(c){
      var hot = c.days_since_order < 30 ? '<span class="tag HOT">ACTIVE</span>' : '';
      var cold = c.days_since_order > 180 ? '<span class="tag COLD">AT RISK</span>' : '';
      
      var yoyPct = (c.pytd_usd && isNum(c.pytd_usd) && c.pytd_usd !== 0) ? ((c.ytd_usd - c.pytd_usd) / Math.abs(c.pytd_usd) * 100) : null;
      var yoyHtml = '';
      if(yoyPct !== null && isNum(yoyPct)) {
        yoyHtml = '<div style="font-size:11px; font-weight:800; margin-top:4px; text-align:right;" class="'+(yoyPct>=0?'up':'down')+'">' + (yoyPct>=0?'▲ ':'▼ ') + Math.abs(yoyPct).toFixed(0) + '% YoY</div>';
      } else {
         yoyHtml = '<div style="font-size:11px; font-weight:800; color:var(--slate-400); margin-top:4px; text-align:right;">--</div>';
      }

      return '<div class="listrow'+(SEL_CUSTOMER===c.customer_id?' sel':'')+'" onclick="SEL_CUSTOMER=\''+attr(c.customer_id)+'\';renderSafe()">' +
        '<div style="width:70%;">' +
           '<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;">'+esc(c.name)+hot+cold+'</div>' +
           '<div style="font-size:12px;color:var(--slate-500);font-weight:600;margin-top:4px;">'+esc(c.state||'Unknown Region')+'</div>' +
        '</div>' +
        '<div style="flex-shrink:0;text-align:right;"><b>'+moneyShort(c.ytd_usd)+'</b>'+yoyHtml+'</div></div>';
    }).join('') + '</div></div>';
    
  var rightHtml = '<div class="empty">Select a customer from the list to view their deep profile.</div>';
  
  if(SEL_CUSTOMER) {
    var cu = null; clist.forEach(function(c){if(c.customer_id===SEL_CUSTOMER) cu=c;});
    if(cu) {
      var aov = cu.orders ? cu.lifetime_usd / cu.orders : 0;
      rightHtml = 
        '<div class="panel"><h3>'+esc(cu.name)+' '+(cu.is_new?'<span class="tag NEW">NEW THIS YEAR</span>':'')+'</h3>' +
        '<div class="cards" style="grid-template-columns:1fr 1fr; margin-bottom:20px;">' +
          kcard('YTD Sales', money(cu.ytd_usd), delta(cu.ytd_usd, cu.pytd_usd), 'blue') +
          kcard('Lifetime Sales', money(cu.lifetime_usd), '<span class="d mut">'+num(cu.orders)+' total orders</span>', 'violet') +
          kcard('Avg Order Value', money(aov), '', '') +
          kcard('Idle Days', num(cu.days_since_order), '<span class="d mut">Since last order</span>', (cu.days_since_order > 180 ? 'rose' : '')) +
        '</div>' +
        '<div style="padding:16px; background:var(--bg); border-radius:8px; border:1px solid var(--line); margin-bottom:20px; font-size:13px;">' +
          '<div style="margin-bottom:8px;"><b>Last Order Date:</b> '+esc(cu.last_order_date)+'</div>' +
          '<div><b>Account Status:</b> '+ (cu.days_since_order > 180 ? '<span style="color:var(--red);font-weight:800;">At Risk ('+cu.days_since_order+' days idle)</span>' : '<span style="color:var(--green);font-weight:800;">Healthy</span>') + '</div>' +
        '</div>' +
        '<button class="btn dark" style="width:100%; padding:14px; font-size:15px;" onclick="OP.search=\''+attr(cu.name)+'\'; OP.status=\'all\'; go(\'orders\')">View Order History for '+esc(cu.name)+' ›</button>' +
        '</div>';
    }
  }
  el.innerHTML = '<div class="split">' + listHtml + '<div>' + rightHtml + '</div></div>';
}

function renderOps(el) {
  if(!P.exceptions || !P.exceptions.length) {
    el.innerHTML = '<div class="empty">No exceptions or pending operations found. Your pipeline is clear!</div>';
    return;
  }
  var cards = P.exceptions.map(function(ex) {
     var cls = 'amber'; var action = '';
     if(ex.status_canonical === 'Pending Approval') { cls='rose'; action = 'Credit Hold / Manual Approval Required'; }
     if(ex.status_canonical === 'Pending Fulfillment') { cls='blue'; action = 'Waiting on Warehouse to Pick/Pack'; }
     if(ex.status_canonical === 'Pending Billing') { cls='green'; action = 'Shipped, awaiting invoice processing'; }
     if(ex.status_canonical === 'Pending Receipt') { cls='rose'; action = 'Return Merchandise waiting to be received'; }
     
     return '<div class="card '+cls+'" style="cursor:pointer;" onclick="OP.status=\''+attr(ex.status_canonical)+'\';OP.search=\'\';go(\'orders\')">' +
            '<div class="t">'+esc(ex.status_canonical)+'</div><div class="v">'+num(ex.orders)+' orders</div>' +
            '<span class="d mut">'+money(ex.val)+' locked</span><div style="font-size:12px;color:var(--slate-500);margin-top:10px;font-weight:600;">'+action+'</div></div>';
  }).join('');
  
  el.innerHTML = 
    '<div style="font-size:14px;color:var(--slate-500);margin-bottom:24px;line-height:1.5;">The pipeline below shows orders that are actively holding up your commissions or revenue. <br>Click any exception block to jump to the Order Tracker and view the specific POs.</div>' +
    '<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr));">' + cards + '</div>';
}

function renderOrders(el) {
  var sopts = '<option value="all">All Statuses</option>' + 
              '<option value="Billed" '+(OP.status==='Billed'?'selected':'')+'>Billed / Completed</option>' +
              '<option value="Pending Fulfillment" '+(OP.status==='Pending Fulfillment'?'selected':'')+'>Pending Fulfillment</option>' +
              '<option value="Pending Approval" '+(OP.status==='Pending Approval'?'selected':'')+'>Pending Approval</option>' +
              '<option value="Pending Billing" '+(OP.status==='Pending Billing'?'selected':'')+'>Pending Billing</option>';
              
  el.innerHTML = 
    '<div class="slicers">' +
      '<select id="oStatus">'+sopts+'</select>' +
      '<input id="oSearch" placeholder="Search PO#, Doc#, or Customer" style="flex:1; min-width:280px;" value="'+esc(OP.search||'')+'">' +
      '<button class="btn dark" onclick="loadOrders(1)">Search Orders</button>' +
      (OP.search || OP.status!=='all' ? '<button class="btn" onclick="OP.search=\'\';OP.status=\'all\';loadOrders(1)">Clear Filters</button>' : '') +
    '</div>' +
    '<div id="ordersBody"><div class="spin">Querying Live Database...</div></div>';
  loadOrders(OP.page || 1);
}

function getStatusPill(status) {
  var s = status || 'Unknown';
  if(s === 'Billed' || s === 'Closed') return '<span class="status-pill billed">● '+esc(s)+'</span>';
  if(s.indexOf('Pending Fulfillment')>=0 || s.indexOf('Partially')>=0) return '<span class="status-pill pending">◐ '+esc(s)+'</span>';
  if(s === 'Pending Approval' || s === 'Cancelled') return '<span class="status-pill approval">⚠️ '+esc(s)+'</span>';
  if(s === 'Pending Billing') return '<span class="status-pill shipped">🚚 '+esc(s)+'</span>';
  return '<span class="status-pill default">'+esc(s)+'</span>';
}

function getTrackingLink(carrier, tracking) {
  if(!tracking) return '<span style="color:var(--slate-400);font-size:12px;font-weight:600;">Unshipped</span>';
  var t = esc(tracking.split(';')[0].trim()); 
  var urls = { UPS: 'https://www.ups.com/track?tracknum=', USPS: 'https://tools.usps.com/go/TrackConfirmAction?tLabels=', FedEx: 'https://www.fedex.com/apps/fedextrack/?tracknumbers=' };
  var base = urls[carrier] || 'https://www.google.com/search?q=';
  return '<a href="'+base+encodeURIComponent(t)+'" target="_blank" rel="noopener noreferrer" class="trk-link" title="Track on '+esc(carrier)+'">' +
         '<span class="trk-icon">📦</span> ' + t + '</a>' + 
         '<div style="font-size:10px;color:var(--slate-400);margin-top:6px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;">'+esc(carrier)+'</div>';
}

function loadOrders(page) {
  OP.page = page;
  var elSearch = document.getElementById('oSearch'); var elStatus = document.getElementById('oStatus');
  if(elSearch) OP.search = elSearch.value; if(elStatus) OP.status = elStatus.value;
  OP.rep = P.activeRep;
  
  var ob = document.getElementById('ordersBody');
  if(ob) ob.innerHTML = '<div class="spin">Fetching orders securely...</div>';
  
  google.script.run.withSuccessHandler(function(json){
    var r; try{ r = JSON.parse(json); }catch(e){ return ob.innerHTML='<div class="empty">Bad JSON response</div>'; }
    if(!r.ok) return ob.innerHTML = '<div class="empty" style="color:var(--red)">Query failed: '+esc(r.error)+'</div>';
    if(!r.rows.length) {
      ob.innerHTML = '<div class="empty" style="padding:80px 20px;"><h3>No orders found.</h3><p style="margin-top:12px;">Try adjusting your search or status filter.</p></div>';
      return;
    }
    
    var tableHtml = 
      '<div class="panel" style="padding:0;"><div class="table-responsive"><table>' +
      '<tr><th>Date / Doc #</th><th>Customer Info</th><th class="num">Net USD</th><th>Status</th><th>Shipping & Tracking</th></tr>' +
      r.rows.map(function(x) {
        var emailHtml = x.customer_email ? '<a href="mailto:'+attr(x.customer_email)+'" class="email-link">✉️ '+esc(x.customer_email)+'</a>' : '';
        return '<tr>' +
          '<td><div style="font-weight:800;color:var(--slate-900);">'+esc(x.order_date)+'</div><div style="font-size:12px;color:var(--slate-500);margin-top:6px;font-weight:600;">'+esc(x.document_number)+'</div></td>' +
          '<td><div style="font-weight:800;">'+esc(x.customer_name)+'</div>'+emailHtml+'</td>' +
          '<td class="num" style="font-weight:800; font-size:15px;">'+money(x.net_usd)+'</td>' +
          '<td>'+getStatusPill(x.status_canonical)+'</td>' +
          '<td>'+getTrackingLink(x.carrier, x.tracking)+'</td>' +
        '</tr>';
      }).join('') + '</table></div></div>';
      
    var pagerHtml = 
      '<div class="pager">' +
      '<button onclick="loadOrders('+Math.max(r.page-1,1)+')" '+(r.page<=1?'disabled':'')+'>‹ Prev</button>' +
      '<span style="color:var(--slate-500);">Page '+r.page+' of '+r.pages+' &nbsp;·&nbsp; '+num(r.total)+' orders</span>' +
      '<button onclick="loadOrders('+Math.min(r.page+1,r.pages)+')" '+(r.page>=r.pages?'disabled':'')+'>Next ›</button>' +
      '</div>';
      
    document.getElementById('ordersBody').innerHTML = tableHtml + pagerHtml;
  }).withFailureHandler(function(e){
    document.getElementById('ordersBody').innerHTML = '<div class="empty">Connection error: '+esc(e.message||e)+'</div>';
  }).getOrders(JSON.stringify(OP));
}
</script>
</body>
</html>
